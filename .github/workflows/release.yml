name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish exact release assets
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Validate release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Invalid release tag '$env:RELEASE_VERSION'"
          }
          if ("${{ github.ref }}" -ne "refs/tags/$env:RELEASE_VERSION") {
            throw "Release ref and version disagree"
          }

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build canonical release set
        shell: powershell
        env:
          SIGN_CERT: ${{ secrets.GOAL_SIGN_CERT }}
          SIGN_PASSWORD: ${{ secrets.GOAL_SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP: ${{ secrets.GOAL_SIGN_TIMESTAMP_SERVER }}
        run: |
          .\scripts\build-all.ps1 -ReleaseVersion $env:RELEASE_VERSION

      - name: Verify exact upload allowlist and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $expectedBin = @(
            "goal-windows-amd64.exe",
            "goal-linux-amd64",
            "checksums.txt"
          ) | Sort-Object
          $expectedRelease = @(
            "goal-$version-windows-amd64.zip",
            "goal-$version-linux-amd64.tar.gz",
            "checksums.txt"
          ) | Sort-Object
          $expectedChecksumAssets = @(
            "goal-$version-windows-amd64.zip",
            "goal-$version-linux-amd64.tar.gz"
          ) | Sort-Object

          function Assert-ExactFileSet([string]$directory, [string[]]$expected) {
            $actual = @(Get-ChildItem -LiteralPath $directory -File | ForEach-Object Name | Sort-Object)
            $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
            if ($difference.Count -ne 0) {
              throw "Unexpected artifact set in '$directory': $($difference | Out-String)"
            }
          }

          Assert-ExactFileSet "bin" $expectedBin
          Assert-ExactFileSet "releases" $expectedRelease

          foreach ($forbidden in @("goal--windows-amd64.zip", "goal--linux-amd64.tar.gz")) {
            if (Test-Path -LiteralPath "releases/$forbidden") {
              throw "Forbidden empty-version artifact exists: $forbidden"
            }
          }

          $checksumLines = @(Get-Content -LiteralPath "releases/checksums.txt")
          if ($checksumLines.Count -ne 2) {
            throw "Release checksums must list exactly two canonical archives"
          }
          $listedChecksumAssets = @()
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed checksum line: $line"
            }
            $expectedHash = $Matches[1]
            $assetName = $Matches[2]
            if ($assetName -notin $expectedChecksumAssets) {
              throw "Unexpected asset in checksums: $assetName"
            }
            $listedChecksumAssets += $assetName
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "releases/$assetName").Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $assetName"
            }
          }
          if (@(Compare-Object -ReferenceObject $expectedChecksumAssets -DifferenceObject @($listedChecksumAssets | Sort-Object)).Count -ne 0) {
            throw "Release checksums do not list the exact canonical archive set"
          }

      - name: Upload exact release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            bin/goal-windows-amd64.exe
            bin/goal-linux-amd64
            releases/goal-${{ github.ref_name }}-windows-amd64.zip
            releases/goal-${{ github.ref_name }}-linux-amd64.tar.gz
            releases/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
