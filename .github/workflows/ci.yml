name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ADR 021 Slice 3, RV-1 gate visibility: a package-level "ok" line hides an
# individual SKIP, so each OS test job re-runs exactly the 24 Slice 3 legs
# verbosely. The names are the audit record — a leg renamed or removed out from
# under this list makes the guard fail instead of silently matching nothing.
env:
  ADR021_SLICE3_TESTS: '^(TestD4InstanceFieldEnumerationIsComplete|TestD4PublicationScanAuthorizesTestSupportPublications|TestD4PublicationScanInventoryMatchesTheRepository|TestD4ScanCatchesPlantedViolations|TestD4ScanDocumentsItsOwnBlindSpots|TestD4ScanDoesNotInventViolations|TestD4ScanFailsClosedOnAnUnattributedControllerReceiver|TestD4ScanFailsOnAVanishedPublication|TestD4ScanIgnoresNonControllerLookAlikes|TestT1StoppingViewReadableWhileProcessAlive|TestT2CollectionRouteReportsStoppingWhileProcessIsAlive|TestT2InstanceServiceListReportsStoppingWhileProcessIsAlive|TestT2InstanceServiceStatusReportsStoppingWhileProcessIsAlive|TestT2ItemRouteReportsStoppingWhileProcessIsAlive|TestT2SupervisorListReportsStoppingWhileHeld|TestT2SupervisorStatusReportsStoppingWhileHeld|TestT3CrossModelArbitrationCompletesWhileHeld|TestT3I3ReaderPrimitivesCompleteWhileHeld|TestT4RestartDuringHeldStopDoesNotPublishThroughLiveRun|TestT4StartDuringHeldStopIsArbitratedAgainstStopping|TestT4StopDuringHeldStopTakesNoSecondOwnership|TestT5DurableRecordStaysRunningWhileLiveViewIsStopping|TestT6ReleasedGateStopMatchesUngatedStop|TestT6StopGateIsNilByDefault)$'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "go mod tidy changed go.mod or go.sum"
            git diff
            exit 1
          fi

      - name: Check no binaries in repo
        run: |
          found=false
          for f in $(find . -maxdepth 2 -path ./testdata -prune -o -path ./node_modules -prune -o -type f \( -name "*.exe" -o -name "goal" -o -name "goal-linux-*" \) -print); do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Binary tracked in git: $f"
              found=true
            fi
          done
          if $found; then
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Build
        run: go build ./...

  test-linux:
    name: Test (Linux, race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run tests
        run: go test ./...

      # -timeout 20m: the handlers package under -race measures 443s-600s+
      # across CI runner observations (runs 129-131); the default 10m
      # per-package timeout left no headroom for slow runners.
      - name: Run tests with race detector
        run: CGO_ENABLED=1 go test -race -timeout 20m ./...

      - name: Run go vet
        run: go vet ./...

      # Scoped and additive: the two full-suite steps above keep their coverage and
      # their commands byte-for-byte. -count=1 stops a cached replay from standing
      # in for a live run; nothing here uses continue-on-error, so a failing leg
      # still fails the job.
      - name: Run ADR 021 Slice 3 tests verbosely
        shell: bash
        run: |
          set -euo pipefail
          PKGS='./internal/process ./internal/application ./internal/webui/handlers'
          matched=$(go test -list "$ADR021_SLICE3_TESTS" $PKGS | grep -c '^Test')
          echo "ADR 021 Slice 3 legs matched by -list: $matched (24 expected)"
          test "$matched" -eq 24
          go test -count=1 -timeout 20m -v -run "$ADR021_SLICE3_TESTS" $PKGS

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      # The same scoped verbose evidence as the Linux job, on the runner whose
      # checkout re-terminates the source: the individual result lines below are
      # what make a Windows-side regression visible in the log.
      - name: Run ADR 021 Slice 3 tests verbosely
        shell: bash
        run: |
          set -euo pipefail
          PKGS='./internal/process ./internal/application ./internal/webui/handlers'
          matched=$(go test -list "$ADR021_SLICE3_TESTS" $PKGS | grep -c '^Test')
          echo "ADR 021 Slice 3 legs matched by -list: $matched (24 expected)"
          test "$matched" -eq 24
          go test -count=1 -timeout 20m -v -run "$ADR021_SLICE3_TESTS" $PKGS

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  browser-acceptance:
    name: Browser Acceptance (Chromium, headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser suite dependencies
        working-directory: tests/browser
        run: npm ci

      - name: Install headless Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance suites
        working-directory: tests/browser
        run: npm test
