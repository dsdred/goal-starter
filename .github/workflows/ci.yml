name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "go mod tidy changed go.mod or go.sum"
            git diff
            exit 1
          fi

      - name: Check no binaries in repo
        run: |
          found=false
          for f in $(find . -maxdepth 1 -type f \( -name "*.exe" -o -name "goal" -o -name "goal-linux-*" \)); do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Binary tracked in git: $f"
              found=true
            fi
          done
          if $found; then
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Build
        run: go build ./...

  test-linux:
    name: Test (Linux, race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: CGO_ENABLED=1 go test -race ./...

      - name: Run go vet
        run: go vet ./...

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
